    <script>
      // Repasse de origem para o checkout: guarda os parametros da primeira
      // visita e cola no link da Cakto no momento do clique. Delegacao no
      // documento porque os links sao renderizados pelo React.
      (function () {
        var CHAVES = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","gclid","ttclid","src","sck"];
        function daUrl() {
          var p = new URLSearchParams(location.search), o = {};
          CHAVES.forEach(function (k) { var v = p.get(k); if (v) o[k] = v; });
          return o;
        }
        var origem = daUrl();
        try {
          if (Object.keys(origem).length) sessionStorage.setItem("af_origem", JSON.stringify(origem));
          else { var g = sessionStorage.getItem("af_origem"); if (g) origem = JSON.parse(g); }
        } catch (e) {}
        document.addEventListener("click", function (ev) {
          var a = ev.target && ev.target.closest && ev.target.closest('a[href*="pay.cakto.com.br"]');
          if (!a) return;
          try {
            var u = new URL(a.href);
            Object.keys(origem).forEach(function (k) { if (!u.searchParams.has(k)) u.searchParams.set(k, origem[k]); });
            a.href = u.toString();
          } catch (e) {}
        }, true);
      })();
    </script>
